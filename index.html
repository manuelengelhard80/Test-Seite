    <script>
      // Safe fetch shim to prevent "Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          let originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get() {
              return originalFetch;
            },
            set(newFetch) {
              originalFetch = newFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn("Could not patch window.fetch setter directly, attempting prototype fallback:", e);
          try {
            let originalFetch = window.fetch;
            Object.defineProperty(Object.getPrototypeOf(window), 'fetch', {
              get() {
                return originalFetch;
              },
              set(newFetch) {
                originalFetch = newFetch;
              },
              configurable: true,
              enumerable: true
            });
          } catch (err) {
            console.warn("Could not patch prototype window.fetch either:", err);
          }
        }
      })();
    </script>
